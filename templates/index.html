<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Babysitter Tracker</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f0f2f5; --card: #fff; --primary: #4f6ef7; --green: #22c55e;
    --orange: #f97316; --red: #ef4444; --border: #e2e8f0;
    --text: #1e293b; --muted: #64748b; --radius: 10px;
  }
  body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* ── Nav ── */
  nav { background: var(--card); border-bottom: 1px solid var(--border); padding: 0 16px; display: flex; gap: 4px; }
  nav button { background: none; border: none; padding: 14px 16px; cursor: pointer; font-size: .9rem;
    color: var(--muted); border-bottom: 2px solid transparent; transition: color .15s; }
  nav button.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }
  nav button:hover:not(.active) { color: var(--text); }

  /* ── Banner ── */
  #banner { display: none; position: sticky; top: 0; z-index: 10; background: #1e293b;
    color: #fff; padding: 10px 16px; font-size: .9rem; align-items: center; gap: 12px; flex-wrap: wrap; }
  #banner.show { display: flex; }
  #banner b { color: #86efac; }
  #banner button { margin-left: auto; background: var(--primary); color: #fff; border: none;
    padding: 6px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; }
  #banner button:disabled { opacity: .5; cursor: default; }
  #banner .clear-btn { background: #475569; margin-left: 4px; }

  /* ── Toolbar ── */
  .toolbar { padding: 12px 16px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .toolbar select, .toolbar input { padding: 7px 10px; border: 1px solid var(--border);
    border-radius: 6px; font-size: .875rem; background: var(--card); }
  .toolbar label { font-size: .875rem; color: var(--muted); }

  /* ── Grid ── */
  #clips-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 14px; padding: 0 16px 24px; }

  /* ── Clip card ── */
  .clip-card { background: var(--card); border-radius: var(--radius); overflow: hidden;
    border: 2px solid transparent; transition: border-color .15s, transform .1s; }
  .clip-card:hover { transform: translateY(-2px); }
  .clip-card.arrived { border-color: var(--green); }
  .clip-card.departed { border-color: var(--orange); }

  .clip-thumb { position: relative; width: 100%; aspect-ratio: 16/9; background: #0f172a;
    cursor: pointer; overflow: hidden; }
  .clip-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .clip-thumb video { display: none; width: 100%; height: 100%; object-fit: cover; }
  .clip-thumb.playing img { display: none; }
  .clip-thumb.playing video { display: block; }
  .play-icon { position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; background: rgba(0,0,0,.35); transition: opacity .15s; }
  .clip-thumb.playing .play-icon { display: none; }
  .play-icon svg { width: 40px; height: 40px; fill: #fff; }

  .clip-body { padding: 10px 12px; }
  .clip-time { font-weight: 700; font-size: 1rem; }
  .clip-date { font-size: .8rem; color: var(--muted); margin-bottom: 8px; }
  .clip-actions { display: flex; gap: 6px; }
  .clip-actions button { flex: 1; padding: 6px 4px; border: none; border-radius: 6px;
    font-size: .8rem; font-weight: 600; cursor: pointer; transition: opacity .15s; }
  .btn-arrive { background: #dcfce7; color: #166534; }
  .btn-arrive.active { background: var(--green); color: #fff; }
  .btn-depart { background: #ffedd5; color: #9a3412; }
  .btn-depart.active { background: var(--orange); color: #fff; }

  /* ── Sessions table ── */
  .section { padding: 16px; }
  table { width: 100%; border-collapse: collapse; font-size: .875rem; background: var(--card);
    border-radius: var(--radius); overflow: hidden; }
  th { background: #f8fafc; color: var(--muted); font-weight: 600; text-align: left;
    padding: 10px 14px; border-bottom: 1px solid var(--border); }
  td { padding: 10px 14px; border-bottom: 1px solid var(--border); }
  tr:last-child td { border-bottom: none; }
  .del-btn { background: none; border: none; color: var(--red); cursor: pointer; font-size: 1rem; }

  /* ── Summary cards ── */
  .summary-totals { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .stat-card { background: var(--card); border-radius: var(--radius); padding: 14px 18px; flex: 1; min-width: 130px; }
  .stat-card .label { font-size: .78rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .stat-card .value { font-size: 1.6rem; font-weight: 700; margin-top: 4px; }

  /* ── Manual entry ── */
  .form-card { background: var(--card); border-radius: var(--radius); padding: 20px; max-width: 420px; }
  .form-row { margin-bottom: 14px; }
  .form-row label { display: block; font-size: .85rem; font-weight: 600; margin-bottom: 4px; }
  .form-row input { width: 100%; padding: 8px 10px; border: 1px solid var(--border);
    border-radius: 6px; font-size: .9rem; }
  .preview-box { background: #f8fafc; border-radius: 8px; padding: 12px; margin: 12px 0;
    font-size: .9rem; display: none; }
  .preview-box.show { display: block; }
  .preview-box .row { display: flex; justify-content: space-between; padding: 2px 0; }
  .preview-box .total { font-weight: 700; font-size: 1.05rem; border-top: 1px solid var(--border); margin-top: 6px; padding-top: 6px; }
  .btn-primary { background: var(--primary); color: #fff; border: none; padding: 10px 22px;
    border-radius: 8px; font-size: .95rem; font-weight: 600; cursor: pointer; }
  .btn-primary:disabled { opacity: .5; cursor: default; }

  .empty { text-align: center; padding: 48px; color: var(--muted); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  @media (max-width: 480px) {
    #clips-grid { grid-template-columns: 1fr 1fr; }
    .clip-actions button { font-size: .72rem; }
  }
</style>
</head>
<body>

<nav>
  <button class="active" onclick="showTab('clips')">Clips</button>
  <button onclick="showTab('sessions')">Sessions</button>
  <button onclick="showTab('summary')">Weekly Summary</button>
  <button onclick="showTab('manual')">Manual Entry</button>
</nav>

<div id="banner">
  <span id="banner-text">Select an arrival and departure clip.</span>
  <button id="save-btn" disabled onclick="saveSession()">Save Session</button>
  <button class="clear-btn" onclick="clearSelection()">Clear</button>
</div>

<!-- CLIPS TAB -->
<div id="tab-clips" class="tab-panel active">
  <div class="toolbar">
    <label>Week:</label>
    <select id="week-select" onchange="loadClips()"></select>
    <label>Date:</label>
    <input type="date" id="date-filter" onchange="loadClips()">
    <button onclick="clearDateFilter()" style="font-size:.8rem;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--card);cursor:pointer">Clear date</button>
  </div>
  <div id="clips-grid"></div>
</div>

<!-- SESSIONS TAB -->
<div id="tab-sessions" class="tab-panel">
  <div class="toolbar">
    <label>Week:</label>
    <select id="session-week-select" onchange="loadSessions()"></select>
  </div>
  <div class="section">
    <table id="sessions-table">
      <thead><tr>
        <th>Date</th><th>Arrived</th><th>Departed</th>
        <th>Hours</th><th>Pay</th><th></th>
      </tr></thead>
      <tbody id="sessions-body"></tbody>
    </table>
  </div>
</div>

<!-- SUMMARY TAB -->
<div id="tab-summary" class="tab-panel">
  <div class="toolbar">
    <label>Week:</label>
    <select id="summary-week-select" onchange="loadSummary()"></select>
  </div>
  <div class="section">
    <div class="summary-totals" id="summary-totals"></div>
    <table id="summary-table">
      <thead><tr>
        <th>Date</th><th>Arrived</th><th>Departed</th>
        <th>Peak hrs</th><th>Off-peak hrs</th><th>Total hrs</th><th>Total pay</th>
      </tr></thead>
      <tbody id="summary-body"></tbody>
    </table>
  </div>
</div>

<!-- MANUAL TAB -->
<div id="tab-manual" class="tab-panel">
  <div class="section">
    <div class="form-card">
      <h2 style="margin-bottom:16px;font-size:1.1rem">Add session manually</h2>
      <div class="form-row">
        <label>Date</label>
        <input type="date" id="m-date" oninput="calcPreview()">
      </div>
      <div class="form-row">
        <label>Arrived</label>
        <input type="time" id="m-arrived" oninput="calcPreview()">
      </div>
      <div class="form-row">
        <label>Departed</label>
        <input type="time" id="m-departed" oninput="calcPreview()">
      </div>
      <div class="preview-box" id="preview-box">
        <div class="row"><span>Peak hours (9 AM–3 PM)</span><span id="p-peak-hrs">—</span></div>
        <div class="row"><span>Peak pay ($16/hr)</span><span id="p-peak-pay">—</span></div>
        <div class="row"><span>Off-peak hours</span><span id="p-op-hrs">—</span></div>
        <div class="row"><span>Off-peak pay ($10/hr)</span><span id="p-op-pay">—</span></div>
        <div class="row total"><span>Total</span><span id="p-total">—</span></div>
      </div>
      <button class="btn-primary" id="m-save-btn" disabled onclick="saveManual()">Save Session</button>
    </div>
  </div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let sel = { arrived: null, departed: null };
let currentWeek = '';
let allWeeks = [];

// ── Tab routing ────────────────────────────────────────────────────────────
function showTab(name) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  event.target.classList.add('active');
  if (name === 'sessions') loadSessions();
  if (name === 'summary') loadSummary();
}

// ── Week helpers ───────────────────────────────────────────────────────────
function isoWeek(d) {
  const dt = d ? new Date(d) : new Date();
  const thu = new Date(dt);
  thu.setDate(dt.getDate() - ((dt.getDay() + 6) % 7) + 3);
  const jan4 = new Date(thu.getFullYear(), 0, 4);
  const week = 1 + Math.round(((thu - jan4) / 86400000 - 3 + (jan4.getDay() + 6) % 7) / 7);
  return `${thu.getFullYear()}-W${String(week).padStart(2, '0')}`;
}

function fmtTime(iso) {
  const d = new Date(iso);
  return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}
function fmtDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
}
function fmtHrs(h) { return h.toFixed(2) + ' hrs'; }
function fmtPay(p) { return '$' + p.toFixed(2); }

async function loadWeeks() {
  const res = await fetch('/api/clips/weeks');
  allWeeks = await res.json();
  const now = isoWeek();
  if (!allWeeks.includes(now)) allWeeks.unshift(now);

  ['week-select', 'session-week-select', 'summary-week-select'].forEach(id => {
    const sel = document.getElementById(id);
    sel.innerHTML = allWeeks.map(w =>
      `<option value="${w}" ${w === now ? 'selected' : ''}>${w}</option>`).join('');
  });
  currentWeek = now;
}

// ── Clips ──────────────────────────────────────────────────────────────────
async function loadClips() {
  const week = document.getElementById('week-select').value;
  const date = document.getElementById('date-filter').value;
  let url = `/api/clips?week=${week}`;
  if (date) url += `&date=${date}`;

  const clips = await fetch(url).then(r => r.json());
  const grid = document.getElementById('clips-grid');

  if (!clips.length) {
    grid.innerHTML = '<div class="empty" style="grid-column:1/-1">No clips found for this period.<br><small>Make sure your Nest integration is saving event media.</small></div>';
    return;
  }

  grid.innerHTML = clips.map(c => `
    <div class="clip-card ${sel.arrived?.path===c.path?'arrived':''} ${sel.departed?.path===c.path?'departed':''}" id="card-${c.ts}">
      <div class="clip-thumb" id="thumb-${c.ts}" onclick="togglePlay('${c.ts}','${c.path}')">
        <img src="/thumb/${c.path}" onerror="this.style.display='none'" alt="">
        <video id="vid-${c.ts}" preload="none" muted playsinline></video>
        <div class="play-icon"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
      </div>
      <div class="clip-body">
        <div class="clip-time">${c.time}</div>
        <div class="clip-date">${c.date}</div>
        <div class="clip-actions">
          <button class="btn-arrive ${sel.arrived?.path===c.path?'active':''}"
            onclick="markArrived(${c.ts},'${c.path}','${c.datetime}')">Arrived</button>
          <button class="btn-depart ${sel.departed?.path===c.path?'active':''}"
            onclick="markDeparted(${c.ts},'${c.path}','${c.datetime}')">Departed</button>
        </div>
      </div>
    </div>`).join('');
}

function clearDateFilter() {
  document.getElementById('date-filter').value = '';
  loadClips();
}

function togglePlay(ts, path) {
  const thumb = document.getElementById('thumb-' + ts);
  const vid = document.getElementById('vid-' + ts);
  if (!thumb.classList.contains('playing')) {
    vid.src = '/video/' + path;
    vid.play();
    thumb.classList.add('playing');
    vid.onended = () => thumb.classList.remove('playing');
  } else {
    vid.pause();
    vid.src = '';
    thumb.classList.remove('playing');
  }
}

function markArrived(ts, path, dt) {
  if (sel.arrived?.path === path) { sel.arrived = null; }
  else { sel.arrived = { ts, path, dt }; }
  updateBanner();
  loadClips();
}

function markDeparted(ts, path, dt) {
  if (sel.departed?.path === path) { sel.departed = null; }
  else { sel.departed = { ts, path, dt }; }
  updateBanner();
  loadClips();
}

async function updateBanner() {
  const banner = document.getElementById('banner');
  const saveBtn = document.getElementById('save-btn');
  const txt = document.getElementById('banner-text');

  if (!sel.arrived && !sel.departed) {
    banner.classList.remove('show');
    return;
  }
  banner.classList.add('show');

  if (sel.arrived && sel.departed) {
    const res = await fetch(`/api/preview?arrived=${sel.arrived.dt}&departed=${sel.departed.dt}`);
    const p = await res.json();
    if (p.error) { txt.textContent = 'Error: ' + p.error; saveBtn.disabled = true; return; }
    txt.innerHTML = `<b>${fmtHrs(p.hours_total)}</b> &nbsp;|&nbsp;
      Peak ${fmtHrs(p.hours_peak)} × $16 = <b>${fmtPay(p.pay_peak)}</b> &nbsp;|&nbsp;
      Off-peak ${fmtHrs(p.hours_offpeak)} × $10 = <b>${fmtPay(p.pay_offpeak)}</b> &nbsp;|&nbsp;
      Total: <b>${fmtPay(p.pay_total)}</b>`;
    saveBtn.disabled = false;
  } else {
    txt.textContent = sel.arrived
      ? `Arrived at ${fmtTime(sel.arrived.dt)} — now select departure clip.`
      : `Departed at ${fmtTime(sel.departed.dt)} — now select arrival clip.`;
    saveBtn.disabled = true;
  }
}

async function saveSession() {
  if (!sel.arrived || !sel.departed) return;
  const body = {
    arrived: sel.arrived.dt,
    departed: sel.departed.dt,
    arrived_clip: sel.arrived.path,
    departed_clip: sel.departed.path,
  };
  const res = await fetch('/api/sessions', { method: 'POST',
    headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (res.ok) { clearSelection(); loadClips(); }
  else { alert('Failed to save session: ' + await res.text()); }
}

function clearSelection() {
  sel = { arrived: null, departed: null };
  updateBanner();
  loadClips();
}

// ── Sessions ───────────────────────────────────────────────────────────────
async function loadSessions() {
  const week = document.getElementById('session-week-select').value;
  const rows = await fetch(`/api/sessions?week=${week}`).then(r => r.json());
  const tbody = document.getElementById('sessions-body');

  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="6" class="empty">No sessions this week.</td></tr>';
    return;
  }
  tbody.innerHTML = rows.map(r => `<tr>
    <td>${r.date}</td>
    <td>${fmtTime(r.arrived)}</td>
    <td>${fmtTime(r.departed)}</td>
    <td>${fmtHrs(r.hours_total)}</td>
    <td><b>${fmtPay(r.pay_total)}</b>
      <small style="color:var(--muted);display:block">
        ${fmtPay(r.pay_peak)} peak + ${fmtPay(r.pay_offpeak)} off-peak
      </small></td>
    <td><button class="del-btn" onclick="deleteSession(${r.id})" title="Delete">✕</button></td>
  </tr>`).join('');
}

async function deleteSession(id) {
  if (!confirm('Delete this session?')) return;
  await fetch(`/api/sessions/${id}`, { method: 'DELETE' });
  loadSessions();
}

// ── Summary ────────────────────────────────────────────────────────────────
async function loadSummary() {
  const week = document.getElementById('summary-week-select').value;
  const data = await fetch(`/api/weekly-summary?week=${week}`).then(r => r.json());
  const { by_date, totals } = data;

  document.getElementById('summary-totals').innerHTML = `
    <div class="stat-card"><div class="label">Total Pay</div><div class="value">${fmtPay(totals.pay_total)}</div></div>
    <div class="stat-card"><div class="label">Total Hours</div><div class="value">${totals.hours_total.toFixed(2)}</div></div>
    <div class="stat-card"><div class="label">Peak Hours</div><div class="value">${totals.hours_peak.toFixed(2)}</div></div>
    <div class="stat-card"><div class="label">Off-Peak Hours</div><div class="value">${totals.hours_offpeak.toFixed(2)}</div></div>
  `;

  const tbody = document.getElementById('summary-body');
  if (!Object.keys(by_date).length) {
    tbody.innerHTML = '<tr><td colspan="7" class="empty">No sessions this week.</td></tr>';
    return;
  }

  let html = '';
  for (const [date, sessions] of Object.entries(by_date).sort()) {
    const dayTotal = sessions.reduce((a, s) => a + s.pay_total, 0);
    sessions.forEach((s, i) => {
      html += `<tr>
        ${i === 0 ? `<td rowspan="${sessions.length}">${date}</td>` : ''}
        <td>${fmtTime(s.arrived)}</td>
        <td>${fmtTime(s.departed)}</td>
        <td>${s.hours_peak.toFixed(2)}</td>
        <td>${s.hours_offpeak.toFixed(2)}</td>
        <td>${s.hours_total.toFixed(2)}</td>
        <td>${fmtPay(s.pay_total)}</td>
      </tr>`;
    });
    if (sessions.length > 1) {
      html += `<tr style="background:#f8fafc;font-weight:600">
        <td colspan="5" style="text-align:right">Day total</td>
        <td>${fmtPay(dayTotal)}</td>
      </tr>`;
    }
  }
  tbody.innerHTML = html;
}

// ── Manual entry ───────────────────────────────────────────────────────────
async function calcPreview() {
  const date = document.getElementById('m-date').value;
  const arr = document.getElementById('m-arrived').value;
  const dep = document.getElementById('m-departed').value;
  const box = document.getElementById('preview-box');
  const saveBtn = document.getElementById('m-save-btn');
  if (!date || !arr || !dep) { box.classList.remove('show'); saveBtn.disabled = true; return; }

  const res = await fetch(`/api/preview?arrived=${date}T${arr}&departed=${date}T${dep}`);
  const p = await res.json();
  if (p.error) { box.classList.remove('show'); saveBtn.disabled = true; return; }

  document.getElementById('p-peak-hrs').textContent = fmtHrs(p.hours_peak);
  document.getElementById('p-peak-pay').textContent = fmtPay(p.pay_peak);
  document.getElementById('p-op-hrs').textContent = fmtHrs(p.hours_offpeak);
  document.getElementById('p-op-pay').textContent = fmtPay(p.pay_offpeak);
  document.getElementById('p-total').textContent = fmtPay(p.pay_total);
  box.classList.add('show');
  saveBtn.disabled = false;
}

async function saveManual() {
  const date = document.getElementById('m-date').value;
  const arr = document.getElementById('m-arrived').value;
  const dep = document.getElementById('m-departed').value;
  const body = { arrived: `${date}T${arr}`, departed: `${date}T${dep}` };
  const res = await fetch('/api/sessions', { method: 'POST',
    headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (res.ok) {
    document.getElementById('m-date').value = '';
    document.getElementById('m-arrived').value = '';
    document.getElementById('m-departed').value = '';
    document.getElementById('preview-box').classList.remove('show');
    document.getElementById('m-save-btn').disabled = true;
    alert('Session saved!');
  } else { alert('Failed: ' + await res.text()); }
}

// ── Init ───────────────────────────────────────────────────────────────────
(async () => {
  await loadWeeks();
  // Set today's date as default for manual entry
  document.getElementById('m-date').value = new Date().toISOString().slice(0, 10);
  loadClips();
})();
</script>
</body>
</html>
