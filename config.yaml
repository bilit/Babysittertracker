name: "Babysitter Tracker"
description: "Track babysitter hours from Nest doorbell clips with automatic pay calculation"
version: "1.0.0"
slug: "babysitter_tracker"
init: false
arch:
  - aarch64
  - amd64
  - armv7
map:
  - config:ro
  - share:rw
  - data:rw
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: "Web UI"
ingress: true
ingress_port: 8099
panel_icon: mdi:baby-carriage
panel_title: Babysitter Tracker
options:
  camera_entity: "camera.front_door"
  person_sensor: "event.front_door_bell_motion"
  snapshot_subdir: ".cache/nest/event_media"
  timezone: "America/New_York"
schema:
  camera_entity: str
  person_sensor: str
  snapshot_subdir: str
  timezone: str
