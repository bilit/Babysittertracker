services:
  babysitter-tracker:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-5050}:8099"
    environment:
      CAMERA_ENTITY: "${CAMERA_ENTITY}"
      PERSON_SENSOR: "${PERSON_SENSOR}"
      SNAPSHOT_DIR: "nest/event_media"
      TIMEZONE: "${TIMEZONE:-America/New_York}"
    volumes:
      # Mount your HA config directory so the app can read Nest clips.
      # Replace the host path with your actual HA config directory.
      # Examples:
      #   HA OS:     /mnt/data/supervisor/homeassistant:/config:ro
      #   HA Docker: /home/user/ha-config:/config:ro
      - /YOUR/HA/CONFIG/DIR:/config:ro
      - babysitter_data:/data

volumes:
  babysitter_data:
